<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Chống zoom màn hình trên thiết bị di động (đặc biệt là iOS) để có trải nghiệm giống Native App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Flashcard 3D - Học Ngoại Ngữ</title>
    
    <!-- Inline CSS cho Màn hình chờ (Hiển thị ngay lập tức không cần chờ tải file CSS ngoài) -->
    <style>
      body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        font-family: system-ui, -apple-system, sans-serif; 
        background-color: #f8fafc; 
        overflow: hidden;
      }
      #fc-preloader { 
        display: flex; flex-direction: column; align-items: center; justify-content: center; 
        height: 100vh; width: 100%; position: relative; 
      }
      .fc-spinner { 
        width: 50px; height: 50px; 
        border: 4px solid #bfdbfe; border-top-color: #2563eb; 
        border-radius: 50%; 
        animation: fc-spin 1s linear infinite; 
        margin-bottom: 20px; 
      }
      .fc-loading-text { 
        color: #475569; font-weight: 700; font-size: 16px; 
      }
      @keyframes fc-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    
    <!-- LÃNH THỔ CỦA REACT -->
    <div id="root">
      <!-- Màn hình chờ siêu gọn nhẹ, chỉ có vòng xoay và Text -->
      <div id="fc-preloader">
        <div class="fc-spinner"></div>
        <div class="fc-loading-text">Đang khởi tạo ứng dụng...</div>
      </div>
    </div>
    
    <!-- Điểm mồi gọi Bo mạch chủ (Bộ kích hoạt Vite) -->
    <script type="module" src="/src/main.jsx"></script>
    
  </body>
</html>
